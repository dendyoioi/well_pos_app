version: '3.8'

services:
  # ==========================================
  # Database: PostgreSQL 16 Alpine
  # ==========================================
  pos_postgres:
    image: postgres:16-alpine
    container_name: pos_production_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pos_prod_network

  # ==========================================
  # In-Memory Cache: Redis 7 Alpine
  # ==========================================
  pos_redis:
    image: redis:7-alpine
    container_name: pos_production_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pos_prod_network

  # ==========================================
  # Backend API: Node.js Multi-Stage Container
  # ==========================================
  pos_server:
    build:
      context: ./pos_apps/server
      dockerfile: Dockerfile
    container_name: pos_production_server
    restart: always
    depends_on:
      pos_postgres:
        condition: service_healthy
      pos_redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@pos_postgres:5432/${POSTGRES_DB:-pos_db}?schema=public
      REDIS_URL: redis://pos_redis:6379
      JWT_SECRET: ${JWT_SECRET:-production_secure_jwt_token_secret_key_2026}
    expose:
      - "5001"
    networks:
      - pos_prod_network

  # ==========================================
  # Frontend Web SPA & Reverse Proxy: Nginx
  # ==========================================
  pos_client:
    build:
      context: ./pos_apps/client
      dockerfile: Dockerfile
    container_name: pos_production_client
    restart: always
    depends_on:
      - pos_server
    ports:
      - "${PORT:-80}:80"
    networks:
      - pos_prod_network

networks:
  pos_prod_network:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
