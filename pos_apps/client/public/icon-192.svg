<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f2454" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="accent" x1="40" y1="40" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="192" height="192" rx="42" fill="url(#bg)" />
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.3" />

  <!-- Center Store / POS Terminal Icon -->
  <g transform="translate(46, 42)" filter="url(#glow)">
    <!-- Store Roof / Awning -->
    <path d="M50 8 L90 32 L10 32 Z" fill="url(#accent)" />
    <!-- Awning ridges -->
    <path d="M10 32 Q20 44 30 32 Q40 44 50 32 Q60 44 70 32 Q80 44 90 32" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <!-- Shop Front Body -->
    <rect x="18" y="38" width="64" height="48" rx="6" fill="#ffffff" fill-opacity="0.95" />
    <!-- Door / Register Display -->
    <rect x="36" y="52" width="28" height="34" rx="4" fill="#0f2454" />
    <rect x="42" y="58" width="16" height="10" rx="2" fill="#38bdf8" />
    <circle cx="50" cy="76" r="2.5" fill="#10b981" />
  </g>

  <!-- Text brand at bottom -->
  <text x="96" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="19" fill="#ffffff" letter-spacing="1">WELL POS</text>
  <circle cx="152" cy="144" r="3.5" fill="#10b981" />
</svg>
