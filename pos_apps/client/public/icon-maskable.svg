<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgMask" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f2454" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="accentMask" x1="140" y1="140" x2="360" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for maskable cutouts -->
  <rect width="512" height="512" fill="url(#bgMask)" />

  <!-- Center Store / POS Terminal Icon (Within 80% safe circle) -->
  <g transform="translate(146, 130)">
    <!-- Store Roof / Awning -->
    <path d="M110 20 L200 75 L20 75 Z" fill="url(#accentMask)" />
    <!-- Awning ridges -->
    <path d="M20 75 Q42 100 65 75 Q88 100 110 75 Q132 100 155 75 Q177 100 200 75" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <!-- Shop Front Body -->
    <rect x="36" y="88" width="148" height="110" rx="14" fill="#ffffff" fill-opacity="0.95" />
    <!-- Door / Register Display -->
    <rect x="80" y="118" width="60" height="80" rx="8" fill="#0f2454" />
    <rect x="92" y="132" width="36" height="22" rx="4" fill="#38bdf8" />
    <circle cx="110" cy="176" r="5" fill="#10b981" />
  </g>

  <!-- Text brand at bottom -->
  <text x="256" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="2">WELL POS</text>
  <circle cx="380" cy="360" r="8" fill="#10b981" />
</svg>
